<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../src/fonts.css">
<!-- START -->
<title>Styrkestasjoner</title>
<style>
/* Utskriftsark i A4. Hvert ark måles i --mm (1/210 av arkbredden), så det skalerer på skjerm og blir nøyaktig A4 på papir.
   Hver øvelse har sin egen farge: --c (sterk), --cs (lys), --ci (tekst på lys bakgrunn). */
:root {
  --ink: #2F2A3B;
  --muted: #625C70;
  --paper: #FFFFFF;
  --desk: #E7E9EE;
  --line: #DCDFE6;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--body); }

/* ---------- Skjermvisning: meny og stabel av ark ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-inline: 16px;
}
.top-in { max-width: 210mm; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.top h1 { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 0 8px 0 0; line-height: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 13px/1 var(--body); color: var(--ink); text-decoration: none;
  padding: 7px 11px 7px 8px; border-radius: 99px; background: var(--desk);
}
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip:hover, .chip:focus-visible { background: var(--cs); outline: 2px solid var(--c); outline-offset: 0; }
.intro { max-width: 210mm; margin: 18px auto 0; padding-inline: 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.intro b { color: var(--ink); }
.stack { display: grid; gap: 28px; justify-items: center; padding-block: 18px 48px; padding-inline: 16px; }

/* ---------- Arket ---------- */
.sheet {
  width: min(210mm, 100%);
  aspect-ratio: 210 / 297;
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(30,30,50,.08), 0 8px 30px rgba(30,30,50,.10);
  container-type: inline-size;
  overflow: hidden;
  scroll-margin-top: 70px;
}
.in {
  --mm: calc(100cqw / 210);
  height: 100%;
  display: flex; flex-direction: column;
  font-size: calc(var(--mm) * 3.55);
  line-height: 1.42;
}
.mm { font-size: calc(var(--mm) * 3.55); }

/* Toppfelt */
.head {
  background: var(--c);
  color: #fff;
  padding: calc(var(--mm)*6.5) calc(var(--mm)*12) calc(var(--mm)*6);
  position: relative; overflow: hidden;
}
.head .ring { position: absolute; border-radius: 50%; border: calc(var(--mm)*5) solid rgba(255,255,255,.16); }
.head .eyebrow { font-family: var(--display); font-weight: 600; font-size: calc(var(--mm)*4); letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
.head h2 { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*14); line-height: .9; margin: calc(var(--mm)*1.5) 0 calc(var(--mm)*2); letter-spacing: -.01em; text-wrap: balance; position: relative; }
.head p { margin: 0; font-size: calc(var(--mm)*4.1); font-weight: 600; max-width: calc(var(--mm)*175); position: relative; line-height: 1.3; }
.head.dark-text { color: var(--ci); }
.head.dark-text .ring { border-color: rgba(255,255,255,.35); }

.body { flex: 1; padding: calc(var(--mm)*5) calc(var(--mm)*12) calc(var(--mm)*7); display: flex; flex-direction: column; gap: calc(var(--mm)*4.2); min-height: 0; }

/* Illustrasjon */
.illu { background: var(--cs); border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*3) calc(var(--mm)*6) calc(var(--mm)*4); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: calc(var(--mm)*2); }
.pose { display: grid; justify-items: center; gap: calc(var(--mm)*1); }
.pose svg { width: 100%; height: calc(var(--mm)*45); display: block; }
.pose .lab { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*4.6); color: var(--ci); display: flex; align-items: center; gap: calc(var(--mm)*2); line-height: 1; }
.pose .lab i { font-style: normal; width: calc(var(--mm)*6.6); height: calc(var(--mm)*6.6); border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: calc(var(--mm)*4); padding-top: calc(var(--mm)*.5); }
.dark-num .pose .lab i, .dark-num .steps li::before { color: var(--ci); }
.illu .then { width: calc(var(--mm)*10); height: calc(var(--mm)*10); color: var(--c); }

/* Midtre rad */
.mid { display: grid; grid-template-columns: 1.25fr 1fr; align-items: start; gap: calc(var(--mm)*6); }
h3 { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*6.4); line-height: 1; margin: 0 0 calc(var(--mm)*3); color: var(--ink); }
h3 .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--c); margin-right: .3em; vertical-align: .08em; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: calc(var(--mm)*2.2); font-size: calc(var(--mm)*3.45); }
.steps li { counter-increment: s; display: grid; grid-template-columns: calc(var(--mm)*7) 1fr; gap: calc(var(--mm)*3); align-items: start; }
.steps li::before { content: counter(s); width: calc(var(--mm)*7); height: calc(var(--mm)*7); border-radius: 50%; background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*4.2); display: grid; place-items: center; padding-top: calc(var(--mm)*.5); }
.steps b { font-weight: 800; }

.muscles { border: calc(var(--mm)*.6) solid var(--line); border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*4) calc(var(--mm)*4.5) calc(var(--mm)*4); display: flex; flex-direction: column; }
.muscles svg { width: 100%; height: calc(var(--mm)*50); display: block; }
.legend { display: grid; gap: calc(var(--mm)*2); margin-top: calc(var(--mm)*2); }
.legend .row { display: grid; grid-template-columns: calc(var(--mm)*5.5) 1fr; gap: calc(var(--mm)*2.2); align-items: start; }
.legend .sw { width: calc(var(--mm)*5.5); height: calc(var(--mm)*5.5); border-radius: calc(var(--mm)*1.4); background: var(--c); margin-top: calc(var(--mm)*.3); }
.legend .sw.sec { background: repeating-linear-gradient(45deg, var(--c) 0 calc(var(--mm)*.9), var(--cs) calc(var(--mm)*.9) calc(var(--mm)*1.8)); }
.legend .k { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*4); line-height: 1.1; }
.legend .v { font-size: calc(var(--mm)*3.3); line-height: 1.35; }
.legend .v em { font-style: italic; color: var(--muted); }

/* Nederste rad */
.low { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--mm)*6); flex: 1; min-height: 0; }
.midl { display: flex; flex-direction: column; gap: calc(var(--mm)*4.2); }
.dose { background: var(--c); color: #fff; border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*4) calc(var(--mm)*5); display: grid; grid-template-columns: auto 1fr; gap: calc(var(--mm)*4); align-items: center; }
.dose.dark-text { color: var(--ci); }
.dose .big { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*12); line-height: .9; white-space: nowrap; padding-top: calc(var(--mm)*1); }
.dose .big small { display: block; font-size: calc(var(--mm)*3.6); font-weight: 600; letter-spacing: .02em; margin-top: calc(var(--mm)*.5); }
.dose p { margin: 0; font-size: calc(var(--mm)*3.4); line-height: 1.35; }
.dose p + p { margin-top: calc(var(--mm)*1.3); }
.theory { border: calc(var(--mm)*.8) solid var(--c); border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*4) calc(var(--mm)*5); flex: 1; }
.eyebrow-s { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*3.3); letter-spacing: .1em; text-transform: uppercase; color: var(--ci); }
.theory h4, .alt h4 { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*5.6); line-height: 1.05; margin: calc(var(--mm)*.6) 0 calc(var(--mm)*1.8); }
.theory p, .alt p { margin: 0; font-size: calc(var(--mm)*3.45); line-height: 1.42; }
.theory p + p, .alt p + p { margin-top: calc(var(--mm)*1.6); }
.alt { background: var(--cs); border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*4) calc(var(--mm)*5); display: flex; flex-direction: column; }
.alt svg { width: 100%; height: calc(var(--mm)*23); display: block; margin: calc(var(--mm)*.5) 0 calc(var(--mm)*2); background: var(--paper); border-radius: calc(var(--mm)*4); }
.alt .fit { background: var(--paper); border-radius: calc(var(--mm)*3); padding: calc(var(--mm)*2) calc(var(--mm)*3); margin-top: auto; font-size: calc(var(--mm)*3.3); line-height: 1.35; }
.alt .fit + .fit { margin-top: calc(var(--mm)*1.6); }
.alt .fit b { color: var(--ci); }
.altdose { font-family: var(--body); font-weight: 800; font-size: calc(var(--mm)*3.2); background: var(--paper); color: var(--ci); border-radius: 99px; padding: calc(var(--mm)*.6) calc(var(--mm)*2.4); white-space: nowrap; vertical-align: .2em; }
.alt .gap { flex: 1; min-height: calc(var(--mm)*2); }

/* ---------- Refleksjonsarket ---------- */
.refl .head { background: var(--ink); }
.stripes { display: flex; height: calc(var(--mm)*3); }
.stripes span { flex: 1; }
.refl .body { gap: calc(var(--mm)*4.5); }
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--mm)*5) calc(var(--mm)*6); }
.qblock { border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*4) calc(var(--mm)*5) calc(var(--mm)*4.5); background: var(--cs); }
.qblock h3 { font-size: calc(var(--mm)*5.8); margin-bottom: calc(var(--mm)*2.6); color: var(--ci); }
.qblock ol { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(var(--mm)*2.6); }
.qblock li { display: grid; grid-template-columns: calc(var(--mm)*6) 1fr; gap: calc(var(--mm)*2.4); }
.qblock li > i { font-style: normal; width: calc(var(--mm)*6); height: calc(var(--mm)*6); border-radius: 50%; background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*3.5); display: grid; place-items: center; padding-top: calc(var(--mm)*.4); margin-top: calc(var(--mm)*.2); }
.qblock .q { font-weight: 700; font-size: calc(var(--mm)*3.6); line-height: 1.35; }
.qblock .h { font-size: calc(var(--mm)*3.15); color: var(--muted); line-height: 1.35; margin-top: calc(var(--mm)*.6); }
.qblock .h b { color: var(--ci); font-weight: 800; }
.tips { display: grid; grid-template-columns: 1.1fr 1fr; gap: calc(var(--mm)*6); }
.tip { border: calc(var(--mm)*.6) solid var(--line); border-radius: calc(var(--mm)*6); padding: calc(var(--mm)*4) calc(var(--mm)*5); }
.tip h4 { font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*5); margin: 0 0 calc(var(--mm)*1.5); line-height: 1.05; }
.tip p, .tip li { font-size: calc(var(--mm)*3.35); line-height: 1.4; margin: 0; }
.tip ul { margin: 0; padding-left: calc(var(--mm)*4.5); display: grid; gap: calc(var(--mm)*1); }
.scale { display: flex; gap: calc(var(--mm)*2); margin-top: calc(var(--mm)*2.5); }
.scale span { flex: 1; text-align: center; border-radius: calc(var(--mm)*2.5); padding: calc(var(--mm)*1.6) 0 calc(var(--mm)*1); font-family: var(--display); font-weight: 800; font-size: calc(var(--mm)*5.4); line-height: 1; color: #fff; }
.scale span small { display: block; font-family: var(--body); font-weight: 700; font-size: calc(var(--mm)*2.5); margin-top: calc(var(--mm)*.6); line-height: 1.1; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* ---------- Utskrift ---------- */
@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  .top, .intro { display: none; }
  .stack { display: block; padding: 0; }
  .sheet { width: 210mm; height: 297mm; aspect-ratio: auto; box-shadow: none; break-after: page; }
  .sheet:last-child { break-after: auto; }
}
</style>
</head>
<body>
<header class="top">
  <nav class="top-in" id="nav" aria-label="Øvelser"><h1>Styrkestasjoner</h1></nav>
</header>
<p class="intro"><b>Åtte A4-ark til styrketimen:</b> ett informasjonsark per stasjon og ett ark med refleksjonsspørsmål til slutten av timen. Elevene jobber to og to: én løfter, én hviler og ser på teknikken.</p>
<main class="stack" id="stack"></main>

<script>
/* ============ Farger og tegnehjelpere ============ */
const NEUTRAL = { body: "#4A5163", far: "#B3B9C6", eq: "#2B303B", eq2: "#CDD3DC", plate: "#363C4A", hub: "#717A8C", floor: "#D9DDE4", band: "#6E7587" };

function tint(hex, a) { // blander fargen med hvitt; a = andel farge
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = (c) => Math.round(c * a + 255 * (1 - a)).toString(16).padStart(2, "0");
  return "#" + m(r) + m(g) + m(b);
}

function pen(hi) {
  const P = NEUTRAL, hi2 = tint(hi, .45);
  const ln = (a, b, w, c) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const circ = (p, r, c) => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c}"/>`;
  const rect = (x, y, w, h, c, rx = 2) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${c}"/>`;
  const d = {
    hi, hi2, ...P, ln, circ, rect,
    floor: (y) => ln([6, y], [194, y], 3, P.floor),
    leg: (h, k, a, t, c) => ln(h, k, 15, c) + ln(k, a, 11, c) + ln(a, t, 7, c),
    arm: (s, e, h, c) => ln(s, e, 10, c) + ln(e, h, 8, c) + circ(h, 5, c),
    torso: (h, s, c) => ln(h, s, 24, c),
    head: (p, c) => circ(p, 11, c),
    plate: (p, r) => circ(p, r, P.plate) + circ(p, r * .42, P.hub) + circ(p, 3, P.eq2),
    dbH: (p) => ln([p[0] - 8, p[1]], [p[0] + 8, p[1]], 4, P.eq) + rect(p[0] - 13, p[1] - 8, 5, 16, P.eq, 1.5) + rect(p[0] + 8, p[1] - 8, 5, 16, P.eq, 1.5),
    dbV: (p) => ln([p[0], p[1] - 8], [p[0], p[1] + 8], 4, P.eq) + rect(p[0] - 8, p[1] - 13, 16, 5, P.eq, 1.5) + rect(p[0] - 8, p[1] + 8, 16, 5, P.eq, 1.5),
    dbEnd: (p) => circ(p, 7.5, P.eq) + circ(p, 3, P.hub),
    arrow(a, b, c, both) {
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
      const head = (p, s) => `<polygon points="${p[0]},${p[1]} ${p[0] - s * 9 * ux + 6 * nx},${p[1] - s * 9 * uy + 6 * ny} ${p[0] - s * 9 * ux - 6 * nx},${p[1] - s * 9 * uy - 6 * ny}" fill="${c}"/>`;
      const a2 = both ? [a[0] + 6 * ux, a[1] + 6 * uy] : a, b2 = [b[0] - 6 * ux, b[1] - 6 * uy];
      return ln(a2, b2, 4, c) + head(b, 1) + (both ? head(a, -1) : "");
    },
    tag(x, y, text) {
      const w = text.length * 5.4 + 14;
      return `<g><rect x="${x}" y="${y - 8}" width="${w}" height="16" rx="8" fill="#fff" stroke="${hi}" stroke-width="1.6"/><text x="${x + w / 2}" y="${y + 3.6}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="10" fill="#2F2A3B">${text}</text></g>`;
    },
    // Figur forfra
    ftorso: (cx, sy, wy, c) => `<path d="M${cx - 24},${sy} L${cx + 24},${sy} L${cx + 14},${wy} L${cx - 14},${wy} Z" fill="${c}" stroke="${c}" stroke-width="9" stroke-linejoin="round"/>`,
    fhead: (cx, y, c) => ln([cx, y], [cx, y + 22], 10, c) + circ([cx, y], 12, c),
    flegs(hy, ky, ay, c, kneel) {
      let s = ln([91, hy], [89, ky], 15, c) + ln([109, hy], [111, ky], 15, c);
      if (!kneel) s += ln([89, ky], [89, ay], 11, c) + ln([111, ky], [111, ay], 11, c) + `<ellipse cx="86" cy="${ay + 3}" rx="7" ry="3.5" fill="${c}"/><ellipse cx="114" cy="${ay + 3}" rx="7" ry="3.5" fill="${c}"/>`;
      return s;
    },
  };
  return d;
}

function poseSvg(color, pose) {
  const d = pen(color);
  return `<svg viewBox="${pose.vb || "0 0 200 200"}" role="img" aria-label="${pose.label}">${pose.draw(d)}</svg>`;
}

/* ============ Muskelkart (forfra og bakfra) ============ */
const MAP = {
  front: {
    mid: `<ellipse cx="50" cy="14" rx="9" ry="11" class="n"/><rect x="45" y="22" width="10" height="11" rx="3" class="n"/>`,
    side: [
      ["delts_f", `<ellipse cx="32" cy="40" rx="7.5" ry="8"/>`],
      ["pecs", `<path d="M49.4,34 L38,35 Q33,40 35,49 Q41,56 49.4,53 Z"/>`],
      ["biceps", `<ellipse cx="27.5" cy="58" rx="4.6" ry="10" transform="rotate(8 27.5 58)"/>`],
      ["forearms", `<ellipse cx="23.5" cy="81" rx="4" ry="12" transform="rotate(10 23.5 81)"/>`],
      ["", `<circle cx="20.5" cy="96" r="3.6"/>`],
      ["abs", `<path d="M43.6,56 L49.4,56 L49.4,90 Q46,92 43.6,89 Z"/>`],
      ["obliques", `<path d="M42,56 L36.5,53 Q34,70 37,86 L42,90 Z"/>`],
      ["quads", `<path d="M36,93 Q31,116 35,141 L44,142 Q45,120 45,100 Z"/>`],
      ["adductors", `<path d="M45.6,97 L49.4,100 Q49.6,114 45,134 Q46,118 45.6,97 Z"/>`],
      ["", `<circle cx="40" cy="146" r="4"/>`],
      ["", `<ellipse cx="39.5" cy="166" rx="4.6" ry="15"/>`],
      ["", `<ellipse cx="39" cy="185" rx="5" ry="3"/>`],
    ],
    deco: `<g stroke="#fff" stroke-width="1.2"><line x1="43.6" y1="66" x2="56.4" y2="66"/><line x1="43.6" y1="77" x2="56.4" y2="77"/></g>`,
  },
  back: {
    mid: `<ellipse cx="50" cy="14" rx="9" ry="11" class="n"/><rect x="45" y="22" width="10" height="9" rx="3" class="n"/>`,
    side: [
      ["lats", `<path d="M37,44 Q34,58 40,73 L49.4,80 L49.4,60 L44,46 Z"/>`],
      ["traps", `<path d="M49.4,23 L45,28 Q40,32 35,35 L43,40 L49.4,58 Z"/>`],
      ["delts_b", `<ellipse cx="32" cy="40" rx="7.5" ry="8"/>`],
      ["triceps", `<ellipse cx="27.5" cy="58" rx="4.6" ry="10" transform="rotate(8 27.5 58)"/>`],
      ["forearms", `<ellipse cx="23.5" cy="81" rx="4" ry="12" transform="rotate(10 23.5 81)"/>`],
      ["", `<circle cx="20.5" cy="96" r="3.6"/>`],
      ["lowerback", `<path d="M49.4,81 L43,77 Q42,86 43,94 L49.4,96 Z"/>`],
      ["glutes", `<ellipse cx="42.5" cy="104" rx="7.8" ry="9"/>`],
      ["hamstrings", `<path d="M35,113 Q32,128 36,143 L45,143 Q48,127 48,113 Z"/>`],
      ["", `<circle cx="40" cy="147" r="3.5"/>`],
      ["calves", `<ellipse cx="39.5" cy="163" rx="5.5" ry="13"/>`],
      ["", `<ellipse cx="39.5" cy="178" rx="3" ry="6"/>`],
      ["", `<ellipse cx="39" cy="186" rx="4.5" ry="3"/>`],
    ],
    deco: "",
  },
};

function muscleSvg(id, color, prim, sec) {
  const soft = tint(color, .28);
  const fill = (k) => prim.includes(k) ? color : sec.includes(k) ? `url(#h-${id})` : "#DDE1E8";
  const view = (v) => {
    const parts = MAP[v].side.map(([k, el]) => el.replace(/^<(\w+)/, `<$1 fill="${fill(k)}"`)).join("");
    return `<g stroke="#fff" stroke-width="1.1">${MAP[v].mid.replaceAll('class="n"', 'fill="#DDE1E8"')}${parts}<g transform="translate(100 0) scale(-1 1)">${parts}</g></g>${MAP[v].deco}`;
  };
  return `<svg viewBox="0 0 215 206" role="img" aria-label="Muskelkart forfra og bakfra">
    <defs><pattern id="h-${id}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="${soft}"/><rect width="2" height="4" fill="${color}"/></pattern></defs>

    ["Trekk manualen opp mot hoften.", "Albuen går tett langs kroppen og bakover. Skuldrene holdes parallelle med gulvet, uten å vri overkroppen."],
    ["Klem skulderbladet inn mot ryggraden på toppen,", "og senk rolig til strak arm. Ta alle repetisjonene, og bytt arm."],
  ],
  theory: { t: "Kontroll i senkefasen", p: [
    "Musklene jobber også når vekten går ned: de bremser den, og her er de faktisk sterkest. Senk rolig på ca. 2 sekunder og løft bestemt opp. Da får musklene mer arbeid, du styrer bevegelsen bedre, og risikoen for skade blir mindre.",
  ]},
  alt: { name: "Roing med strikk", vb: "0 6 200 188",
    draw: (d) => d.floor(188) + d.rect(4, 20, 8, 168, d.eq2, 2) + d.leg([114, 94], [108, 136], [112, 180], [100, 185], d.body) + d.torso([114, 94], [110, 42], d.hi) + d.head([106, 21], d.body) + d.ln([14, 92], [106, 70], 3, d.band) + d.circ([14, 92], 4, d.eq) + d.arm([110, 42], [134, 64], [106, 70], d.hi) + d.arrow([50, 126], [92, 126], d.hi),
    text: "Fest strikken i brysthøyde. Trekk albuene bakover langs kroppen og klem skulderbladene sammen.",
    fit: "du får vondt i korsryggen når du står foroverbøyd.",
    reps: "3 sett × 8–10" },
},
];

/* ============ Bygg arkene ============ */
const ARROW = `<svg class="then" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ringHtml = `<span class="ring" style="width:calc(var(--mm)*80);height:calc(var(--mm)*80);right:calc(var(--mm)*-22);top:calc(var(--mm)*-30)"></span><span class="ring" style="width:calc(var(--mm)*34);height:calc(var(--mm)*34);right:calc(var(--mm)*48);bottom:calc(var(--mm)*-20)"></span>`;

function legendRow(cls, title, keys, labels) {
  const names = keys.map((k) => { const [n, l] = (labels && labels[k]) || M[k]; return `${n} <em>(${l})</em>`; });
  return `<div class="row"><span class="sw ${cls}"></span><div><div class="k">${title}</div><div class="v">${names.join(", ")}</div></div></div>`;
}

function sheet(e) {
  const vars = `--c:${e.color};--cs:${e.soft};--ci:${e.ink}`;
  const dt = e.darkText ? " dark-text" : "";
  const poses = e.poses.map((p, i) => `<div class="pose">${poseSvg(e.color, p)}<div class="lab"><i>${i + 1}</i>${p.label}</div></div>`).join(ARROW);
  return `<section class="sheet${e.darkText ? " dark-num" : ""}" id="${e.id}" style="${vars}" aria-label="${e.name}"><div class="in">
    <div class="head${dt}">${ringHtml}<div class="eyebrow">Styrkestasjon</div><h2>${e.name}</h2><p>${e.sub}</p></div>
    <div class="body">
      <div class="illu">${poses}</div>
      <div class="mid">
        <div class="midl"><div><h3><span class="dot"></span>Slik gjør du det</h3><ol class="steps">${e.steps.map(([b, t]) => `<li><span><b>${b}</b> ${t}</span></li>`).join("")}</ol></div>
          <div class="dose${dt}"><div class="big">3 × ${e.reps}<small>sett × repetisjoner${e.repsNote ? " " + e.repsNote : ""}</small></div>
            <div><p><b>Hvile:</b> mens partneren din tar sitt sett. Bytt etter hvert sett.</p><p>${e.partner || "<b>Partneren:</b> følg med på teknikken og si fra hvis noe kan bli bedre."}</p></div></div></div>
        <div class="muscles"><h3><span class="dot"></span>Muskler som jobber</h3>${muscleSvg(e.id, e.color, e.prim, e.sec)}
          <div class="legend">${legendRow("", "Jobber mest", e.prim, e.labels)}${legendRow("sec", "Hjelper til", e.sec, e.labels)}</div></div>
      </div>
      <div class="low">
        <div class="theory"><div class="eyebrow-s">Treningslære</div><h4>${e.theory.t}</h4>${e.theory.p.map((x) => `<p>${x}</p>`).join("")}</div>
        <div class="alt"><div class="eyebrow-s">Alternativ øvelse</div><h4>${e.alt.name} <span class="altdose">${e.alt.reps}</span></h4>
          ${poseSvg(e.color, { label: e.alt.name, vb: e.alt.vb, draw: e.alt.draw })}
          <p>${e.alt.text}</p><div class="gap"></div>
          <div class="fit"><b>Passer hvis</b> ${e.alt.fit}</div></div>
      </div>
    </div>
  </div></section>`;
}

/* ============ Refleksjonsarket ============ */
const Q = [
  { t: "Teknikk og kropp", c: "#E5484D", s: "#FDE7E7", i: "#B4232A", q: [
    ["Hvilken øvelse var vanskeligst å gjøre med god teknikk? Hva var det som var vanskelig?", ""],
    ["Velg én øvelse: hvor i kroppen kjente du at det jobbet? Stemte det med muskelkartet på arket?", ""],
    ["Hvilke øvelser trener mange av de samme musklene?", "<b>Stikkord:</b> nedtrekk og roing (ryggen), beinpress og utfall (forsiden av låret og setet), benkpress og skulderpress (triceps)."],
    ["Hvilke øvelser er «skyv», og hvilke er «trekk»? Hvorfor er det lurt å trene begge deler?", "<b>Stikkord:</b> skyv: benkpress, skulderpress, beinpress. Trekk: nedtrekk, roing. Balanse rundt skuldrene og god holdning."],
  ]},
  { t: "Belastning og treningslære", c: "#3E63DD", s: "#E4EAFC", i: "#2240A8", q: [
    ["Hvordan visste du om vekten var passe tung? Hadde du 1–3 repetisjoner igjen i tanken?", ""],
    ["Hvorfor tror du vi valgte 6–10 repetisjoner i dag, og ikke 30?", "<b>Stikkord:</b> tung belastning bygger styrke, mange lette repetisjoner trener mest utholdenhet."],
    ["Hvorfor er det viktig å hvile mellom settene? Hva skjer i musklene mens du hviler?", "<b>Stikkord:</b> kreatinfosfat fylles opp igjen på 1–3 minutter."],
    ["Hva må du gjøre for å bli sterkere i en øvelse over tid?", "<b>Stikkord:</b> progresjon. Øk litt når du klarer 10 gode repetisjoner i alle settene."],
    ["Kjente du forskjell når du senket vekten rolig?", "<b>Stikkord:</b> musklene jobber også i senkefasen, og bremsingen gir mer kontroll."],
  ]},
  { t: "Samarbeid", c: "#2E9E62", s: "#E1F4E8", i: "#1C6E42", q: [
    ["Hvilket teknikktips ga du til partneren din, eller fikk du selv?", ""],
    ["Brukte du en alternativ øvelse? Hvorfor, og hvordan fungerte den?", ""],
  ]},
  { t: "Veien videre", c: "#8B4FC4", s: "#F0E6FA", i: "#62319A", q: [
    ["Hvilken øvelse vil du bli bedre på, og hva er ditt neste steg?", ""],
    ["Hvordan kan styrketrening hjelpe deg i hverdagen eller i en annen idrett du driver med?", ""],
  ]},
];

function reflSheet() {
  const colors = EX.map((e) => `<span style="background:${e.color}"></span>`).join("");
  let n = 0;
  const block = (g) => `<div class="qblock" style="--c:${g.c};--cs:${g.s};--ci:${g.i}"><h3>${g.t}</h3><ol>${g.q.map(([q, h]) => `<li><i>${++n}</i><div><div class="q">${q}</div>${h ? `<div class="h">${h}</div>` : ""}</div></li>`).join("")}</ol></div>`;
  const scale = ["#E5484D", "#F2711C", "#E0A100", "#7DB843", "#2E9E62"].map((c, i) => `<span style="background:${c}">${i + 1}<small>${["Usikker", "", "Litt sikker", "", "Helt sikker"][i]}</small></span>`).join("");
  return `<section class="sheet refl" id="refleksjon" style="--c:#2F2A3B;--cs:#EEEDF2;--ci:#2F2A3B" aria-label="Refleksjon etter økta"><div class="in">
    <div class="head">${ringHtml}<div class="eyebrow">Til læreren · avslutning av timen</div><h2>Refleksjon etter økta</h2><p>Velg 4–6 spørsmål. La elevene snakke to og to i 1–2 minutter før dere tar svarene felles.</p></div>
    <div class="stripes">${colors}</div>
    <div class="body">
      <div class="qgrid">
        <div style="display:grid;gap:calc(var(--mm)*5);align-content:start">${block(Q[0])}${block(Q[2])}</div>
        <div style="display:grid;gap:calc(var(--mm)*5);align-content:start">${block(Q[1])}${block(Q[3])}</div>
      </div>
      <div class="tips">
        <div class="tip"><h4>Exit-lapp på 1 minutt</h4><p>Elevene viser med fingrene, eller skriver på en lapp: <b>Hvor sikker er du på teknikken i markløft?</b> Bytt gjerne ut øvelsen fra time til time.</p><div class="scale">${scale}</div></div>
        <div class="tip"><h4>Slik kan du bruke arket</h4><ul><li>Spør i par, ta svar i plenum.</li><li>Be elevene vise bevegelsen mens de forklarer.</li><li>Ta med muskelkartet: «Pek på musklene som jobbet.»</li><li>Bruk svarene til å velge fokus neste time.</li></ul></div>
      </div>
    </div>
  </div></section>`;
}

/* ============ Sett inn i siden ============ */
document.getElementById("stack").innerHTML = EX.map(sheet).join("") + reflSheet();
document.getElementById("nav").insertAdjacentHTML("beforeend",
  EX.map((e) => `<a class="chip" href="#${e.id}" style="--c:${e.color};--cs:${e.soft}">${e.name}</a>`).join("") +
  `<a class="chip" href="#refleksjon" style="--c:#2F2A3B;--cs:#EEEDF2">Refleksjon</a>`);
</script>

</body>
